<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souptik's Filmmaking & Content Creation</title>
    <link rel="icon" href="img/creative/camera-2.svg" type="image/svg+xml">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f4; /* Light grey background */
            color: #333; /* Dark grey text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative; /* Needed for absolute positioning of children */
            overflow: hidden; /* Hide parts of SVGs that go off-screen */
        }

        .container {
            padding: 40px;
            position: relative; /* Ensure content is on top of SVGs */
            z-index: 2;
        }

        h1 {
            font-size: 2.5em;
            font-weight: 300; /* Lighter font weight */
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 50px;
            color: #777;
            font-weight: 300;
        }

        .social-links a {
            color: #333;
            text-decoration: none;
            font-size: 1.2em;
            margin: 0 25px;
            font-weight: 400;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s ease;
        }

        .social-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 1px;
            background-color: #333;
            transition: width 0.3s ease;
        }

        .social-links a:hover {
            color: #000;
        }

        .social-links a:hover::after {
            width: 100%;
        }

        /* Scattered background SVGs */
        .background-svgs img {
            position: absolute;
            opacity: 0.08;
            z-index: 1;
            pointer-events: none; /* Make them unclickable */
        }

        #svg1 {
            width: 15%;
            top: 10%;
            left: 5%;
            transform: rotate(-15deg);
        }
        #svg2 {
            width: 20%;
            top: 60%;
            left: 15%;
            transform: rotate(10deg);
        }
        #svg3 {
            width: 10%;
            top: 25%;
            left: 70%;
            transform: rotate(5deg);
        }
        #svg4 {
            width: 25%;
            top: 50%;
            left: 75%;
            transform: rotate(25deg);
        }
        #svg5 {
            width: 12%;
            top: 80%;
            left: 50%;
            transform: rotate(-5deg);
        }


        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            .social-links a {
                display: block;
                margin: 15px auto;
                padding: 12px 20px;
                background-color: #e9e9e9;
                border-radius: 8px;
                width: 70%;
                transition: background-color 0.2s ease;
            }
            .social-links a:hover {
                background-color: #ddd;
            }
            /* Remove the underline effect on mobile, as it's now a button */
            .social-links a::after {
                display: none;
            }
            /* Optional: scale down SVGs on mobile instead of hiding */
            .background-svgs img {
                opacity: 0.06;
            }
            #svg1 { width: 25%; }
            #svg2 { width: 30%; top: 65%; }
            #svg3 { display: none; } /* Hide one to reduce clutter */
            #svg4 { width: 35%; top: 45%; left: 65%;}
            #svg5 { display: none; } /* Hide one to reduce clutter */
        }
    </style>
</head>
<body>

    <div class="background-svgs">
        <img src="img/creative/camera-2.svg" id="svg1" alt="Decorative camera icon">
        <img src="img/creative/camera.svg" id="svg2" alt="Decorative camera icon">
        <img src="img/creative/instagram.svg" id="svg3" alt="Decorative instagram icon">
        <img src="img/creative/light.svg" id="svg4" alt="Decorative light icon">
        <img src="img/creative/youtube.svg" id="svg5" alt="Decorative youtube icon">
    </div>

    <div class="container">
        <h1>Behind the Lens</h1>
        <p>Souptik's Filmmaking & Content Creation</p>
        <div class="social-links">
            <a href="https://www.instagram.com/souptik_2001/" target="_blank">Instagram</a>
            <a href="https://www.youtube.com/@souptik2001" target="_blank">YouTube</a>
        </div>
    </div>

</body>
</html>
